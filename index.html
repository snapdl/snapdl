<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapsave - Universal Video Downloader</title>
    <!-- Tailwind CSS for Fast, Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="w-full py-5 px-6 border-b border-slate-800 flex justify-between items-center max-w-5xl mx-auto">
        <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">
            SNAP<span class="text-white">DL</span>
        </h1>
        <span class="text-xs bg-indigo-900 text-indigo-200 py-1 px-3 rounded-full font-medium">v1.0 MVP</span>
    </header>

    <!-- Main Container / Universal Box -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-10">
        <div class="max-w-2xl w-full text-center space-y-6">
            
            <div class="space-y-2">
                <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight">
                    Download Anything, <span class="text-indigo-400">Instantly.</span>
                </h2>
                <p class="text-slate-400 text-sm md:text-base">
                    Paste link from YouTube, Instagram, Facebook, Twitter & more. One box for all.
                </p>
            </div>

            <!-- Universal Input Box Form -->
            <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800 shadow-2xl flex flex-col md:flex-row gap-3">
                <input 
                    type="url" 
                    id="urlInput" 
                    placeholder="Paste any social media link here (e.g., https://...)" 
                    class="flex-grow bg-slate-950 border border-slate-800 rounded-xl px-4 py-4 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                >
                <button 
                    onclick="handleDownload()" 
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-8 py-4 rounded-xl transition shadow-lg shadow-indigo-600/30 cursor-pointer"
                >
                    Download Now 🚀
                </button>
            </div>

            <!-- Platform Supported Icons Badge with Real SVGs -->
            <div class="flex flex-wrap justify-center gap-3 text-slate-300 text-sm pt-2">
                <!-- YouTube Badge -->
                <div class="flex items-center gap-2 bg-slate-900 px-3.5 py-2 rounded-xl border border-slate-800 shadow-sm">
                    <svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                    <span class="font-medium">YouTube</span>
                </div>

                <!-- Instagram Badge -->
                <div class="flex items-center gap-2 bg-slate-900 px-3.5 py-2 rounded-xl border border-slate-800 shadow-sm">
                    <svg class="w-5 h-5 text-pink-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    <span class="font-medium">Instagram</span>
                </div>

                <!-- Facebook Badge -->
                <div class="flex items-center gap-2 bg-slate-900 px-3.5 py-2 rounded-xl border border-slate-800 shadow-sm">
                    <svg class="w-5 h-5 text-blue-500" fill="currentColor" viewBox="0 0 24 24"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/></svg>
                    <span class="font-medium">Facebook</span>
                </div>
            </div>

            <!-- Result Box (Hidden by default, will show after click) -->
            <div id="resultBox" class="hidden mt-8 bg-slate-900 border border-slate-800 p-6 rounded-2xl text-left space-y-4">
                <h3 class="text-lg font-bold text-indigo-300">Generated Download Options:</h3>
                <div id="videoDetails" class="text-sm text-slate-300">
                    <!-- Dynamic result will appear here -->
                </div>
                <div class="flex flex-wrap gap-3 pt-2">
                    <a id="downloadBtn" href="#" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-6 rounded-lg text-sm transition">
                        Download MP4 (HD)
                    </a>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 border-t border-slate-900 text-xs text-slate-500">
        &copy; 2026 SnapDL. Built for Speed & Scale.
    </footer>

    <!-- Simple Frontend Logic Script -->
    <script>
        function handleDownload() {
            const url = document.getElementById('urlInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const videoDetails = document.getElementById('videoDetails');

            if(!url) {
                alert("Bhai pehle link toh paste kar!");
                return;
            }

            // Simple dummy simulation for MVP preview (Backend API will plug in here later)
            resultBox.classList.remove('hidden');
            videoDetails.innerHTML = `
                <p><strong>Detected URL:</strong> <span class="text-slate-400 truncate block">${url}</span></p>
                <p class="text-emerald-400 mt-1">✔ Link parsed successfully! Ready for download.</p>
            `;
        }
    </script>
</body>
</html>
