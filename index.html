<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapDL - Universal Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full py-5 px-6 border-b border-slate-800 flex justify-between items-center max-w-5xl mx-auto">
        <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">
            SNAP<span class="text-white">DL</span>
        </h1>
        <span class="text-xs bg-emerald-900 text-emerald-200 py-1 px-3 rounded-full font-medium">Serverless Pro</span>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-10">
        <div class="max-w-2xl w-full text-center space-y-6">
            
            <div class="space-y-2">
                <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight">
                    Download Anything, <span class="text-indigo-400">Instantly.</span>
                </h2>
                <p class="text-slate-400 text-sm md:text-base">
                    Fast & Free video downloader. No server downtime, zero cost.
                </p>
            </div>

            <!-- Input Box -->
            <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800 shadow-2xl flex flex-col md:flex-row gap-3">
                <input 
                    type="url" 
                    id="urlInput" 
                    placeholder="Paste YouTube or video link here..." 
                    class="flex-grow bg-slate-950 border border-slate-800 rounded-xl px-4 py-4 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                >
                <button 
                    onclick="handleDownload()" 
                    id="downloadBtnElement"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-8 py-4 rounded-xl transition shadow-lg shadow-indigo-600/30 cursor-pointer"
                >
                    Get Links 🚀
                </button>
            </div>

            <!-- Result Box -->
            <div id="resultBox" class="hidden mt-8 bg-slate-900 border border-slate-800 p-6 rounded-2xl text-left space-y-4 shadow-xl">
                <h3 class="text-lg font-bold text-indigo-300 border-b border-slate-800 pb-2">Download Ready:</h3>
                
                <div class="flex flex-col sm:flex-row gap-4 items-center bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <img id="videoThumb" src="" alt="Thumbnail" class="w-full sm:w-36 h-24 object-cover rounded-lg border border-slate-800">
                    <div class="space-y-1 text-center sm:text-left w-full">
                        <h4 id="videoTitle" class="text-sm font-semibold text-slate-200">Video Loaded Successfully</h4>
                        <p class="text-xs text-emerald-400 font-medium">Status: Ready for direct high-speed download</p>
                    </div>
                </div>

                <div class="space-y-2 pt-2">
                    <div id="resolutionList" class="grid grid-cols-1 gap-2">
                        <!-- Direct Action Links -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 border-t border-slate-900 text-xs text-slate-500">
        &copy; 2026 SnapDL. 100% Uptime Serverless Engine.
    </footer>

    <!-- Direct Client-Side Handler -->
    <script>
        function handleDownload() {
            const url = document.getElementById('urlInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const btn = document.getElementById('downloadBtnElement');
            const thumb = document.getElementById('videoThumb');
            const title = document.getElementById('videoTitle');
            const resList = document.getElementById('resolutionList');

            if(!url) {
                alert("Bhai pehle link toh paste kar!");
                return;
            }

            btn.innerText = "Processing...";
            resultBox.classList.remove('hidden');

            try {
                // Extract YouTube Video ID safely
                let videoId = "";
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1]?.split('?')[0];
                } else if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1]?.split('&')[0];
                }

                if (!videoId) {
                    alert("Invalid YouTube URL. Please check the link.");
                    btn.innerText = "Get Links 🚀";
                    resultBox.classList.add('hidden');
                    return;
                }

                // Set thumbnail directly from YouTube's public CDN (Super fast, zero server load)
                thumb.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                title.innerText = "YouTube Video ID: " + videoId;

                // Generate instant redirection / embed options
                resList.innerHTML = `
                    <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-xl text-center font-bold text-sm transition shadow-md block">
                        Watch / Download on YouTube 🎬
                    </a>
                    <a href="https://ssyoutube.com/watch?v=${videoId}" target="_blank" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 p-3 rounded-xl text-center font-bold text-sm transition shadow-md block">
                        Open via Safe Fast Extractor 📥
                    </a>
                `;

                btn.innerText = "Get Links 🚀";

            } catch (err) {
                alert("Something went wrong!");
                btn.innerText = "Get Links 🚀";
                resultBox.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
