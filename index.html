<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapDL - Universal Video Downloader</title>
    <!-- Tailwind CSS for Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="w-full py-5 px-6 border-b border-slate-800 flex justify-between items-center max-w-5xl mx-auto">
        <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">
            SNAP<span class="text-white">DL</span>
        </h1>
        <span class="text-xs bg-indigo-900 text-indigo-200 py-1 px-3 rounded-full font-medium">v1.4 Pro Live</span>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-10">
        <div class="max-w-2xl w-full text-center space-y-6">
            
            <div class="space-y-2">
                <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight">
                    Download Anything, <span class="text-indigo-400">Instantly.</span>
                </h2>
                <p class="text-slate-400 text-sm md:text-base">
                    Paste link from YouTube, Instagram, Facebook & more. Multi-resolution support.
                </p>
            </div>

            <!-- Input Box Form -->
            <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800 shadow-2xl flex flex-col md:flex-row gap-3">
                <input 
                    type="url" 
                    id="urlInput" 
                    placeholder="Paste any social media link here (e.g., https://...)" 
                    class="flex-grow bg-slate-950 border border-slate-800 rounded-xl px-4 py-4 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                >
                <button 
                    onclick="handleDownload()" 
                    id="downloadBtnElement"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-8 py-4 rounded-xl transition shadow-lg shadow-indigo-600/30 cursor-pointer"
                >
                    Download Now 🚀
                </button>
            </div>

            <!-- Result Box (Hidden by default) -->
            <div id="resultBox" class="hidden mt-8 bg-slate-900 border border-slate-800 p-6 rounded-2xl text-left space-y-4 shadow-xl">
                <h3 class="text-lg font-bold text-indigo-300 border-b border-slate-800 pb-2">Video Details & Quality Options:</h3>
                
                <!-- Video Info Section -->
                <div id="videoInfoContainer" class="flex flex-col sm:flex-row gap-4 items-center bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <img id="videoThumb" src="" alt="Thumbnail" class="w-full sm:w-36 h-24 object-cover rounded-lg border border-slate-800">
                    <div class="space-y-1 text-center sm:text-left w-full">
                        <h4 id="videoTitle" class="text-sm font-semibold text-slate-200 line-clamp-2">Loading title...</h4>
                        <p class="text-xs text-slate-400">⏱ Duration: <span id="videoDuration" class="text-indigo-400 font-medium">--:--</span></p>
                    </div>
                </div>

                <!-- Resolution Options Grid -->
                <div class="space-y-2 pt-2">
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Available Formats & Resolutions:</p>
                    <div id="resolutionList" class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                        <!-- Dynamic Resolution Buttons -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 border-t border-slate-900 text-xs text-slate-500">
        &copy; 2026 SnapDL. Built for Speed & Scale.
    </footer>

    <!-- Script connected to Hugging Face Backend -->
    <script>
        async function handleDownload() {
            const url = document.getElementById('urlInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const btn = document.getElementById('downloadBtnElement');
            const thumb = document.getElementById('videoThumb');
            const title = document.getElementById('videoTitle');
            const duration = document.getElementById('videoDuration');
            const resList = document.getElementById('resolutionList');

            if(!url) {
                alert("Bhai pehle link toh paste kar!");
                return;
            }

            // Loading state
            btn.innerText = "Fetching Info...";
            resultBox.classList.remove('hidden');
            title.innerText = "Analyzing video link from servers...";
            duration.innerText = "Calculating...";
            thumb.src = "https://via.placeholder.com/150?text=Loading...";
            resList.innerHTML = `<p class="text-xs text-yellow-400 col-span-full">Connecting to Hugging Face backend...</p>`;

            try {
                // Requesting Hugging Face Python Backend
                const response = await fetch('https://singleboss-snapdl-api.hf.space/getInfo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if(data.error) {
                    alert("Error: " + data.error);
                    btn.innerText = "Download Now 🚀";
                    resultBox.classList.add('hidden');
                    return;
                }

                // Populate real data
                thumb.src = data.thumbnail;
                title.innerText = data.title;
                duration.innerText = data.duration;

                let htmlContent = "";
                data.formats.forEach(fmt => {
                    htmlContent += `
                        <a href="${fmt.url}" download target="_blank" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 p-2.5 rounded-xl flex flex-col items-center justify-center transition text-center cursor-pointer shadow-sm">
                            <span class="font-bold text-xs md:text-sm">${fmt.resolution}</span>
                            <span class="text-[10px] text-slate-400">${fmt.filesize}</span>
                        </a>
                    `;
                });

                resList.innerHTML = htmlContent;
                btn.innerText = "Download Now 🚀";

            } catch (err) {
                alert("Server connection failed! Please check the link or backend status.");
                btn.innerText = "Download Now 🚀";
                resultBox.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
